name: Keepalive

# GitHub switches off scheduled workflows in a repository with no activity for 60 days. Once a month every scheduled
# workflow here is enabled again through the API (which counts as activity and turns back on any that were switched
# off); if the last commit is older than 50 days, an empty commit as well (owner, 20 Oct 2026).
on:
  schedule:
    - cron: "41 3 1 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable every scheduled workflow
        run: |
          for f in .github/workflows/*.yml; do
            if grep -q "^  schedule:" "$f"; then
              name=$(basename "$f")
              gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${name}/enable" && echo "enabled ${name}"
            fi
          done
      - name: Empty commit when the repository has been quiet for 50 days
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "Wugweb"
            git config user.email "admin@wugweb.com"
            git commit --allow-empty -q -m "Keepalive: no commits for 50 days (GitHub stops scheduled workflows after 60)" -m "Co-Authored-By: Wugweb <admin@wugweb.com>"
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
            echo "empty commit pushed"
          else
            echo "last commit $(( ( $(date +%s) - last ) / 86400 )) days ago: no commit needed"
          fi
