name: "News and press titles: sentence case (dry run)"

# Owner, 20 Oct 2026: News headlines in sentence case, letter case only (aw_workers/headline_case.py). This run writes
# nothing to the site: it cases every published News title with the provider chain, keeps only answers that differ in
# letter case alone, lists "Watch:" / "Video of" lead-ins, and uploads news-title-case.csv (id, before, after, status,
# lead_in, without_lead_in) for the owner to review. The reviewed CSV is applied on the server: wp aw news-titles apply.
# Press coverage titles follow the same rule (owner, 20 Oct 2026): choose aw_press; applied with --type=aw_press.
on:
  workflow_dispatch:
    inputs:
      post_type:
        description: "Which titles"
        type: choice
        options: [aw_news, aw_press]
        default: aw_news

concurrency:
  group: news-title-case-${{ inputs.post_type }}
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_INGEST_USER: ${{ secrets.WP_INGEST_USER }}
      WP_INGEST_APP_PASSWORD: ${{ secrets.WP_INGEST_APP_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      LLM_PROVIDERS: ${{ vars.LLM_PROVIDERS }}
      HAIKU_MONTHLY_BUDGET_USD: ${{ vars.HAIKU_MONTHLY_BUDGET_USD || '4' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m aw_workers.headline_case title-case.csv --type "${{ inputs.post_type || 'aw_news' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.post_type == 'aw_press' && 'press-title-case' || 'news-title-case' }}
          path: title-case.csv
          retention-days: 14
