name: "SEO scores (Rank Math)"

# Owner, 17 Oct 2026: every published item gets its Rank Math SEO score stored, as earlier items did. Rank Math works
# the score out only in a browser, so this runs its own analyzer.js on the values its Update SEO Scores tool builds
# (scripts/seo-scores/score.js). Only items with a focus keyword and no stored score: daily, after the focus keywords.
on:
  workflow_dispatch:
    inputs:
      scheduled_cron:
        description: "Set by the site's scheduler (wp aw workers-tick): run as GitHub's schedule would for this cron"
        type: string
        default: ""
  schedule:
    - cron: "45 23 * * *" # 05:15 India time, after focus-keywords (04:00)

concurrency:
  group: seo-scores
  cancel-in-progress: false

jobs:
  scores:
    if: github.event_name != 'schedule' || vars.AW_SCHEDULER != 'site'  # the site starts it on time (wp aw workers-tick)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_INGEST_USER: ${{ secrets.WP_INGEST_USER }}
      WP_INGEST_APP_PASSWORD: ${{ secrets.WP_INGEST_APP_PASSWORD }}
    defaults:
      run:
        working-directory: scripts/seo-scores
    steps:
      - uses: actions/checkout@v5
      - name: Report the start to the site
        uses: ./.github/actions/report
        with:
          phase: start
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/seo-scores/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node score.js
        id: main
      - name: Report the end to the site (Settings → Sourcing → Workers)
        if: always()
        uses: ./.github/actions/report
        with:
          phase: end
          main: main
          steps: ${{ toJSON(steps) }}
          status: ${{ job.status }}
