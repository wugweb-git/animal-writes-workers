name: "NGO Darpan import"

# Owner, 24 Oct 2026: the owner downloads NGO Darpan CSVs (animal-welfare category, state by state); they are imported
# into Directory -> Enrichment review with their source and date, after name, state and district checks. Darpan's own
# site is never read by the worker (it asks for a CAPTCHA).
on:
  workflow_dispatch:
    inputs:
      files:
        description: "CSV files in this repository, comma-separated (e.g. data/darpan/haryana.csv)"
        type: string
        required: true
      dry_run:
        description: "Dry run: match and report, send nothing"
        type: boolean
        default: true

concurrency:
  group: darpan-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      REPORT_DIR: darpan-report
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_INGEST_USER: ${{ secrets.WP_INGEST_USER }}
      WP_INGEST_APP_PASSWORD: ${{ secrets.WP_INGEST_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_darpan_import.py
      - run: python -m aw_workers.directory.darpan_import $(echo "${{ inputs.files }}" | tr ',' ' ')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darpan-report-${{ github.run_id }}
          path: darpan-report/
          retention-days: 90
