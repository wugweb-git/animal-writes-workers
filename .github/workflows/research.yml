name: "Research (India, Europe PMC and Crossref)"

# Owner, 10 Oct 2026: India-only research for Resources → Research, from 1 Nov 2025; weekly after that.
# Papers publish with their own date (sent as backfill). Report: job summary + research-report.json.
on:
  workflow_dispatch:
    inputs:
      scheduled_cron:
        description: "Set by the site's scheduler (wp aw workers-tick): run as GitHub's schedule would for this cron"
        type: string
        default: ""
      dry_run:
        description: "Dry run (search and report only; nothing sent, no summaries written)"
        type: boolean
        default: true
      floor:
        description: "Oldest publication date to include"
        type: string
        default: "2025-11-01"
  schedule:
    - cron: "40 3 * * 1" # Mondays: the last 30 days (the site refuses papers it already has)

jobs:
  research:
    if: github.event_name != 'schedule' || vars.AW_SCHEDULER != 'site'  # the site starts it on time (wp aw workers-tick)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.scheduled_cron != '') && 'false' || (inputs.dry_run && 'true' || 'false') }}
      AW_RESEARCH_FLOOR: ${{ inputs.floor }}
      AW_RESEARCH_DAYS: ${{ (github.event_name == 'schedule' || inputs.scheduled_cron != '') && '30' || '' }}
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_INGEST_USER: ${{ secrets.WP_INGEST_USER }}
      WP_INGEST_APP_PASSWORD: ${{ secrets.WP_INGEST_APP_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      LLM_PROVIDERS: ${{ vars.LLM_PROVIDERS }}
      HAIKU_MONTHLY_BUDGET_USD: "100000"
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
    steps:
      - uses: actions/checkout@v5
      - name: Report the start to the site
        uses: ./.github/actions/report
        with:
          phase: start
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # DOIs already on the site, kept between runs so they are never summarised again (owner, 24 Oct 2026)
      - name: Restore known research DOIs
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: research-known-${{ github.run_id }}
          restore-keys: research-known-
      - run: python -m aw_workers.research
        id: main
      - name: Save known research DOIs
        if: always() && hashFiles('.state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: research-known-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-report
          path: research-report.json
      - name: Report the end to the site (Settings → Sourcing → Workers)
        if: always()
        uses: ./.github/actions/report
        with:
          phase: end
          main: main
          steps: ${{ toJSON(steps) }}
          status: ${{ job.status }}
