name: WordPress cron

# Backup trigger for animalwrites.in's scheduled tasks (DISABLE_WP_CRON is set by animal-writes-core). The main
# trigger is Hostinger's server cron, every 5 minutes; an outside monitor (UptimeRobot) is the second backup. WordPress
# locks the run, so the first to arrive does the work. The site records each trigger (dashboard: Scheduled tasks) and
# emails the owner when none has run for 30 minutes. Kept on every 15 minutes (owner, 20 Oct 2026); GitHub often runs
# it late, which is why it is not the main trigger.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      scheduled_cron:
        description: "Set by the site's scheduler (wp aw workers-tick): run as GitHub's schedule would for this cron"
        type: string
        default: ""

concurrency:
  group: wp-cron
  cancel-in-progress: false

jobs:
  tick:
    if: github.event_name != 'schedule' || vars.AW_SCHEDULER != 'site'  # the site starts it on time (wp aw workers-tick)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
      - name: Run wp-cron.php
        id: main
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "https://animalwrites.in/wp-cron.php?aw_tick=$(date +%s)")
          echo "wp-cron.php HTTP $code"
          test "$code" = "200"
      - name: Report the end to the site (Settings → Sourcing → Workers)
        if: always()
        uses: ./.github/actions/report
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_INGEST_USER: ${{ secrets.WP_INGEST_USER }}
          WP_INGEST_APP_PASSWORD: ${{ secrets.WP_INGEST_APP_PASSWORD }}
        with:
          phase: end
          main: main
          steps: ${{ toJSON(steps) }}
          status: ${{ job.status }}
