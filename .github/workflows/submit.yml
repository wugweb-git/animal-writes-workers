name: Submit URLs (News found by hand)

# One-off, run by hand: each line "URL | YYYY-MM-DD | Publisher | Title (optional)" goes through the same checks as the
# backfill and is sent as backfill (published with its own date; items before the floor are refused). See aw_workers/submit.py.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "One per line: URL | YYYY-MM-DD | Publisher | Title (optional)"
        type: string
        required: true
      dry_run:
        description: "Dry run (fetch and report only; nothing sent, no summaries written)"
        type: boolean
        default: true

concurrency:
  group: sourcing
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      AW_SUBMIT: ${{ inputs.urls }}
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_INGEST_USER: ${{ secrets.WP_INGEST_USER }}
      WP_INGEST_APP_PASSWORD: ${{ secrets.WP_INGEST_APP_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_PROVIDERS: ${{ vars.LLM_PROVIDERS || 'haiku,gemini,groq' }}
      HAIKU_MONTHLY_BUDGET_USD: "100000"
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
    steps:
      - uses: actions/checkout@v5
      - name: Report the start to the site
        uses: ./.github/actions/report
        with:
          phase: start
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore seen-items state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - run: python -m aw_workers.submit
        id: main
      - name: Save seen-items state
        if: always() && inputs.dry_run == false && hashFiles('.state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: seen-${{ github.run_id }}
      - name: Report the end to the site (Settings → Sourcing → Workers)
        if: always()
        uses: ./.github/actions/report
        with:
          phase: end
          main: main
          steps: ${{ toJSON(steps) }}
          status: ${{ job.status }}
