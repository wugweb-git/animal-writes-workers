name: Sourcing workers

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
    - cron: "47 2-23/6 * * *" # backup, 2.5 hours later (seen-items state makes repeats harmless)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no POSTs to WordPress)"
        type: boolean
        default: true

concurrency:
  group: sourcing
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  run:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # DRY_RUN stays ON unless the repo variable DRY_RUN is set to "false"
      # (manual runs use the checkbox instead).
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || vars.DRY_RUN || 'true' }}
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_INGEST_USER: ${{ secrets.WP_INGEST_USER }}
      WP_INGEST_APP_PASSWORD: ${{ secrets.WP_INGEST_APP_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      BRAVE_SEARCH_KEY: ${{ secrets.BRAVE_SEARCH_KEY }}
      LLM_PROVIDERS: ${{ vars.LLM_PROVIDERS || 'haiku,gemini,groq' }}
      HAIKU_MONTHLY_BUDGET_USD: ${{ vars.HAIKU_MONTHLY_BUDGET_USD || '4' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore seen-items state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - run: python -m aw_workers.run
      - name: Save seen-items state
        if: always() && hashFiles('.state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: seen-${{ github.run_id }}
