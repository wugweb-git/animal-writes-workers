name: Sourcing workers

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
    - cron: "47 2-23/6 * * *" # backup, 2.5 hours later (seen-items state makes repeats harmless)
  workflow_dispatch:
    inputs:
      scheduled_cron:
        description: "Set by the site's scheduler (wp aw workers-tick): run as GitHub's schedule would for this cron"
        type: string
        default: ""
      dry_run:
        description: "Dry run (no POSTs to WordPress)"
        type: boolean
        default: true
      window:
        description: "How far back Google News searches look (e.g. 2d, 4d)"
        type: string
        default: "2d"

concurrency:
  group: sourcing
  cancel-in-progress: false

# Tests run in tests.yml on push and pull requests; a failing test emails the owner there and no longer skips
# sourcing (owner, 22 Oct 2026: a sources.yaml copy from the site failed a test and skipped two runs).
jobs:
  run:
    if: github.event_name != 'schedule' || vars.AW_SCHEDULER != 'site'  # the site starts it on time (wp aw workers-tick)
    runs-on: ubuntu-latest
    timeout-minutes: 45 # the run stops taking new items after 25 minutes (AW_TIME_BUDGET_MIN) and saves as it goes
    env:
      # DRY_RUN stays ON unless the repo variable DRY_RUN is set to "false"
      # (manual runs use the checkbox instead).
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.scheduled_cron == '') && (inputs.dry_run && 'true' || 'false') || vars.DRY_RUN || 'true' }}
      AW_WINDOW: ${{ inputs.window || '2d' }}
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_INGEST_USER: ${{ secrets.WP_INGEST_USER }}
      WP_INGEST_APP_PASSWORD: ${{ secrets.WP_INGEST_APP_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LLM_PROVIDERS: ${{ vars.LLM_PROVIDERS || 'gemini,groq' }}
      HAIKU_MONTHLY_BUDGET_USD: ${{ vars.HAIKU_MONTHLY_BUDGET_USD || '4' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
    steps:
      - uses: actions/checkout@v5
      - name: Report the start to the site
        uses: ./.github/actions/report
        with:
          phase: start
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore seen-items state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - run: python -m aw_workers.run
        id: main
      # New items get their Rank Math focus keyword in the same run, not up to a day later at the daily job (owner,
      # 15 Oct 2026: 14 News items published after the 04:00 run had none). Writes only empty fields.
      - name: Focus keywords for new items
        if: env.DRY_RUN == 'false'
        continue-on-error: true
        env:
          AW_SEO_TYPES: aw_news,aw_legal,post
        run: python -m aw_workers.focus_keywords
      - name: Save seen-items state
        if: always() && hashFiles('.state/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: seen-${{ github.run_id }}
      - name: Report the end to the site (Settings → Sourcing → Workers)
        if: always()
        uses: ./.github/actions/report
        with:
          phase: end
          main: main
          steps: ${{ toJSON(steps) }}
          status: ${{ job.status }}
