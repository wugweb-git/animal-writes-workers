name: Sources sync

# The site's lists (Settings → Sourcing) copied into sources.yaml while "Workers use these lists" is on, so the fallback
# file is never stale (owner, 20 Oct 2026). Nothing is written while the switch is off. Since 25 Oct 2026 (owner): the
# site starts this run 2 minutes after the lists or keywords are saved, and the schedule is once a day (07:53 IST).
# From the sourcing restructure's phase 3: also the summary rules (aw_workers/summary_rules.json) and the Directory
# schema with its field rules (aw_workers/directory/directory_schema.json), the site's Rules tab.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: sources-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_INGEST_USER: ${{ secrets.WP_INGEST_USER }}
      WP_INGEST_APP_PASSWORD: ${{ secrets.WP_INGEST_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ssh-key: ${{ secrets.AW_DEPLOY_KEY }}
      - name: Report the start to the site
        uses: ./.github/actions/report
        with:
          phase: start
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Copy the site's lists, summary rules and Directory schema
        id: sync
        run: |
          set -o pipefail
          python scripts/sync_sources.py | tee sync.log
          echo "result=$(tail -1 sync.log)" >> "$GITHUB_OUTPUT"
      - name: Commit the copies
        if: steps.sync.outputs.result == 'changed'
        run: |
          git config user.name "Wugweb"
          git config user.email "admin@wugweb.com"
          git add sources.yaml aw_workers/summary_rules.json
          if [ -f aw_workers/directory/directory_schema.json ]; then git add aw_workers/directory/directory_schema.json; fi
          git commit -m "Sources: copied from the site (Settings → Sourcing)" -m "Co-Authored-By: Wugweb <admin@wugweb.com>"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
      - name: Report the end to the site (Settings → Sourcing → Workers)
        if: always()
        uses: ./.github/actions/report
        with:
          phase: end
          main: sync
          steps: ${{ toJSON(steps) }}
          status: ${{ job.status }}
