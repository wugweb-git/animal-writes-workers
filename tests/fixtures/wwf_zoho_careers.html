<html><body><input type="hidden" value="[{&#34;Posting_Title&#34;:&#34;Project Officer - Raptor Conservation Programme (M.P. &amp; Karnataka)&#34;,&#34;Is_Locked&#34;:false,&#34;City&#34;:&#34;Bhopal&#34;,&#34;Industry&#34;:&#34;Nonprofit Charitable Organizations&#34;,&#34;Job_Description&#34;:&#34;WWF-India is seeking dynamic and self-motivated biologists with a passion for raptor conservation and ecological research. The selected candidate will support the development of Raptor Safe Landscapes by undertaking research and conservation actions that promote safe habitats, secure food resources, and improved ecological conditions for raptors and other avian species. Responsibilities will include field research, raptor monitoring, ecological assessments, data analysis, stakeholder engagement, and implementation of on-ground conservation initiatives. The position will be based at field locations in Karnataka and will require extensive field travel. Terms of Reference for position: · Undertake raptor research and conservation activities to assess the status, distribution, habitat use, prey availability, and factors affecting the long-term survival of raptor populations. Lead ecological surveys, manage and analyse ecological datasets using appropriate statistical tools (including R software), and contribute to scientific reporting and knowledge generation. · Ensure timely implementation of project activities and delivery of outputs in accordance with approved work plans, timelines, and project objectives. · Coordinate with various Government departments, community groups, academic institutions, and other stakeholders for effective planning, implementation, monitoring, and review of project activities. · Identify and work with partners and stakeholders to promote evidence-based raptor conservation and strengthen collaborative conservation initiatives across landscapes. · Identify practical solutions for raptor conservation based on field research, ecological assessments, data analysis, and consultations with key stakeholders. · Coordinate with supervisors and the Communication Team at WWF-India Secretariat for documenting and disseminating project progress, research findings, lessons learned, and conservation success stories. · Represent WWF-India at relevant forums, workshops, meetings, and conferences, and build strategic partnerships and networks with key institutions and stakeholders in the conservation sector. Undertake any other tasks assigned by the organization in furtherance of its conservation and programme objectives. Requirements The Candidate should have experience in ornithology, raptor research, or wildlife ecology. Experience in field surveys, ecological data collection and analysis, and scientific reporting is essential. Experience in stakeholder engagement is desirable. Women candidates are encouraged to apply. Master\u2019s or higher qualification in the field of ecology/wildlife/environment/forest management.&#34;,&#34;Work_Experience&#34;:&#34;1-3 years&#34;,&#34;Job_Type&#34;:&#34;Full time&#34;,&#34;Job_Opening_Name&#34;:&#34;Project Officer - Raptor Conservation Programme (M.P. &amp; Karnataka)&#34;,&#34;State&#34;:&#34;Madhya Pradesh&#34;,&#34;Currency&#34;:&#34;INR&#34;,&#34;Country&#34;:&#34;India&#34;,&#34;id&#34;:&#34;708457000023122001&#34;,&#34;Publish&#34;:true,&#34;Date_Opened&#34;:&#34;2026-06-19&#34;,&#34;Keep_on_Career_Site&#34;:false},{&#34;Posting_Title&#34;:&#34;Sr. Officer/Asst. Manager - Graphic Design&#34;,&#34;Is_Locked&#34;:false,&#34;City&#34;:&#34;New Delhi&#34;,&#34;Industry&#34;:&#34;Nonprofit Charitable Organizations&#34;,&#34;Job_Description&#34;:&#34;WWF-India, one of the country\u2019s leading conservation organizations working towards wildlife and nature conservation, invites applications for the position of Senior Officer/Assistant Manager \u2013 Graphic Design. We are looking for a visual storyteller who engages, informs and inspires people with their work. The candidate will take concepts, conservation projects, objectives, and target audience and create visual representations for both, print and electronic media. Location: New Delhi Employment Type: Full-time (Mon\u2013Fri, on-site) Job Responsibilities Design communication collaterals for print and digital platforms to represent our work and raise awareness among diverse audiences. Brainstorm and collaborate with multiple stakeholders, under the guidance of the Associate Director, on a wide range of materials. Ideate with the content team on creating digital campaigns that tap into our work, trending topics and relevant conservation issues/green days. Understand and implement organizational brand guidelines across all communication design. A. Design for Print · Quarterly Newsletters · Annual Reports · Collaterals for Events · Manage budgets and vendors for printing &amp; production B. Design for Digital · Social Media · E-Mailers · Ads · e-Commerce C. Design across channels · Campaigns · Internal communications · Fundraising D. Design for Products · Support design for Conservation Products (calendars, stationery, merchandise) · Manage vendors for production · Design product promotion posts for digital channels Requirements Bachelor\u2019s degree (equivalent or higher) in graphic design, art or a related discipline. Three or more years of experience in professional graphic design. Proficiency in the Adobe Suite\u2014Photoshop, InDesign and Illustrator\u2014and Canva. Video editing with Adobe Premier Pro and illustration capabilities are advantages. Skills Required Good written and verbal communication skills. Knowledge of layouts, graphic fundamentals, typography, print and web. Experience with both print and digital media. Ability to translate complex scientific, ecological and conservation concepts into accessible visual narratives. Knowledge of conservation is a big plus. Capable of managing multiple projects within design specifications and budget restrictions. Attention to detail. Good at ideating and collaborating in a group of content specialists \u2014 writers, designers, editors \u2014 as well as other stakeholders. Capable of working solo and in a team on a design project, as required. Open to receiving and implementing feedback. Ability to research and write content for designs is a bonus. Last Date for sending applications: 3 Sept 2026 Please note that the applications of only the shortlisted candidates will be acknowledged. WWF-India is an equal opportunities employer. Applications from qualified women are encouraged. Remuneration will be competitive with Indian NGO pay scales and will depend upon candidate\u2019s experience levels and the overall WWF-India salary structure. WWF-India does not provide housing, telephone or vehicle facilities.&#34;,&#34;Work_Experience&#34;:&#34;3-5 years&#34;,&#34;Job_Type&#34;:&#34;Full time&#34;,&#34;Job_Opening_Name&#34;:&#34;Sr. Officer/Asst. Manager - Graphic Design&#34;,&#34;State&#34;:&#34;Delhi&#34;,&#34;Currency&#34;:&#34;INR&#34;,&#34;Country&#34;:&#34;India&#34;,&#34;id&#34;:&#34;708457000023781001&#34;,&#34;Publish&#34;:true,&#34;Date_Opened&#34;:&#34;2026-08-03&#34;,&#34;Keep_on_Career_Site&#34;:false},{&#34;Posting_Title&#34;:&#34;Lead \u2013Programme Development, Advocacy &amp; Partnerships&#34;,&#34;Is_Locked&#34;:false,&#34;City&#34;:&#34;New Delhi&#34;,&#34;Industry&#34;:&#34;Nonprofit Charitable Organizations&#34;,&#34;Job_Description&#34;:&#34;India\u2019s rapid economic growth is leading to new and increased developmental opportunities and challenges at multiple levels. As one of the largest conservation organizations in the country, WWF-India seeks to leverage these opportunities and address these challenges both through enhancing biodiversity conservation, and reducing humanity\u2019s environmental footprint. WWF-India\u2019s Sustainable Business Programme is aimed at working with business and industry in improving environmental and social outcomes. These engagements help corporates (1) understand the impact of their business/ financing and supply chains on critical natural habitats, such as deforestation, extractives, fossil fuel emissions, and (2) find solutions that mitigate business risks and enhance business opportunities that promote positive conservation outcomes, such as sustainable finance, water stewardship, climate innovation, DCF (deforestation and conversion free) supply-chain of deforestation risk soft-commodities, energy transition, renewable energy usage, plastics management, decarbonization of industry. The programme focuses on working around strong levers to materialise transition, such as science-based policy awareness and capacity building, market transformation, and sustainable finance. We are looking for a dynamic and motivated individual with inherent sensitivity towards the conservation of nature to join as Lead \u2013 Programme Development, Advocacy &amp; Partnerships. The role involves programme development, stakeholder and policy engagement, , partnership development, and program management to accelerate corporate sustainability and advance WWF\u2019s conservation goals. Location: New Delhi (On Site) Travel: ~20% Job Profile: Programme Development &amp; Management Lead proposal development and donor engagement to expand WWF-India\u2019s corporate stewardship portfolio Manage projects to ensure timely delivery of outcomes, technical quality, and effective reporting Track progress against project objectives and KPIs, ensuring alignment with WWF\u2019s conservation goals Business Engagement &amp; Market Transformation Lead corporate engagement across key sectors to advance climate action, net-zero commitments,ESG integration, industrial decarbonization, and sustainable supply chains, thereby strengthening the climate orientation of businesses Promote market transformation through strategic partnerships, advocacy, and innovation Provide technical inputs to integrate biodiversity, water, and climate considerations into business operations Apply frameworks like SBTi, SBTN, RE100, Net zero and tools like the Biodiversity &amp; Water Risk Filters to assess corporate risks and guide sustainability action Represent WWF-India in multi-stakeholder coalitions (e.g., India Green Steel Coalition (IGSC), India Sustainable Palm Oil Coalition (I-SPOC)) to drive systemic change Policy Engagement Track and analyse emerging policies, regulations, and standards impacting business sustainability Draft WWF-India\u2019s policy briefs, white papers, and position notes on corporate stewardship and decarbonization pathways Provide strategic inputs for WWF\u2019s engagement with ministries, regulators, trade associations, and industry leaders Represent WWF-India at national and international conferences, platforms, and policy dialogues Stakeholder engagement &amp; Partnerships Build and maintain partnerships with ministries, corporates, financial institutions, and industry bodies Lead engagement with business stakeholders to foster partnerships and advance project objectives Organize workshops, round-tables, and dialogues to promote sector-wide adoption of sustainable business practices Identify and pursue collaborations with bilateral and multilateral agencies, as well as NGOs, to scale collective action initiatives and create new fundraising opportunities Reporting &amp; Line Management Reports to: Director, Sustainable Business, WWF-India Works in close coordination with cross-cutting teams and WWF global network teams Requirements Desired Qualifications &amp; Skills Master\u2019s degree or equivalent in environmental management, sustainability, public policy, engineering, or related disciplines 5\u20138 years\u2019 experience in sustainable business, energy transition, decarbonization, circular economy, or sustainable finance across corporates, consulting, think tanks, or NGOs Effective advocacy and stakeholder engagement skills to influence decision-makers and catalyse policy and corporate action on sustainable business practices Proven track record in stakeholder engagement, partnership development, and policy advocacy Strong understanding of climate, biodiversity, and supply chain &amp; other sustainability frameworks Demonstrated project management, fundraising, and proposal development skills Excellent communication and networking skills, with the ability to represent WWF in high-level forums Application last date - 31 May 2026 Why Join WWF-India? This role offers a unique opportunity to shape India\u2019s transition towards sustainable business and low-carbon growth by leveraging WWF\u2019s brand credibility, science-based expertise, and global network. WWF-India is an equal opportunities employer. We encourage applications from women and diverse candidates.&#34;,&#34;Work_Experience&#34;:&#34;5 -7  years&#34;,&#34;Job_Type&#34;:&#34;Full time&#34;,&#34;Job_Opening_Name&#34;:&#34;Lead \u2013Programme Development, Advocacy &amp; Partnerships&#34;,&#34;State&#34;:&#34;Delhi&#34;,&#34;Currency&#34;:&#34;INR&#34;,&#34;Country&#34;:&#34;India&#34;,&#34;id&#34;:&#34;708457000018138001&#34;,&#34;Publish&#34;:true,&#34;Date_Opened&#34;:&#34;2025-10-10&#34;,&#34;Keep_on_Career_Site&#34;:false},{&#34;Posting_Title&#34;:&#34;Associate Coordinator-Aquatic Biodiversity&#34;,&#34;Is_Locked&#34;:false,&#34;City&#34;:&#34;Rupnagar&#34;,&#34;Industry&#34;:&#34;NGO/Social Services&#34;,&#34;Job_Description&#34;:&#34;Plan and conduct population and habitat surveys (including distribution and abundance) to understand the current status of Dolphin, Gharial, Otters, Turtles, and fish species, their habitats and threats faced in the Sutlej River basin. · Collate and analyze field data to prepare technical reports, manuscripts, and other publications as required for the project, ensuring timely delivery. · Collaborate with key stakeholders in preparing species recovery plans for flagship species in the Sutlej Basin. · Support in development of species-specific management plans for keystone species. · Liaison with a range of local stakeholders, such as government departments, local community and farmer groups for permissions, support, planning of restoration activities in the identified biodiversity hotspots in the Sutlej basin. · Support on-ground implementation of species and their habitat conservation initiatives in the Sutlej basin. · Plan and conduct capacity building of key stakeholders, including \u2013 government department and riparian communities for the scientific monitoring of aquatic species and their habitats. · Support in designing and implementing communications and outreach material to generate awareness, build capacity and change attitudes to generate support for conservation of aquatic resources. Requirements Excellent oral and written communication skills in English and Hindi. Knowledge of Punjabi will be an added advantage. · Basic knowledge of computer applications. · Experience in movement ecology (migration studies), acoustics, and advanced approaches in species research will be an added advantage. Experience with technical research equipment handling and field use such as camera trap, compass, chart plotter, and VHF, UHF transmitters. · Knowledge of ArcGIS, QGIS or other statistical software is desirable. · Meet deadlines and effectively prioritise work under time constraints. · Ability to synthesize and communicate technical and complex information for a non-technical audience, with effective communication skills reaching target audiences. · Good liaison skills with government departments, local communities as well as with other NGOs and agencies working on same issues are desirable. Last date for application - 31 August 2026&#34;,&#34;Work_Experience&#34;:&#34;3-5 years&#34;,&#34;Job_Type&#34;:&#34;Full time&#34;,&#34;Job_Opening_Name&#34;:&#34;Associate Coordinator-Aquatic Biodiversity&#34;,&#34;State&#34;:&#34;Punjab&#34;,&#34;Currency&#34;:&#34;INR&#34;,&#34;Country&#34;:&#34;India&#34;,&#34;id&#34;:&#34;708457000020984005&#34;,&#34;Publish&#34;:true,&#34;Date_Opened&#34;:&#34;2026-02-19&#34;,&#34;Keep_on_Career_Site&#34;:false},{&#34;Posting_Title&#34;:&#34;Coordinator - Sustainable Agriculture Programme&#34;,&#34;Is_Locked&#34;:false,&#34;City&#34;:&#34;Hyderabad&#34;,&#34;Industry&#34;:&#34;Nonprofit Charitable Organizations&#34;,&#34;Job_Description&#34;:&#34;WWF-India is one of the largest organisations, engaged in wildlife and nature conservation for over 50 years. We invite applications from candidates for the position of Coordinator for our Sustainable Agriculture Programme to be based in Hyderabad / Adilabad office. Location: Hyderabad / Adilabad Job Profile: Coordination and Planning: Activity plans are prepared, aligned, and followed consistently across project teams. A joint landscape-level work-plan is developed and operationalized to ensure coordinated delivery. Sustainable Agriculture Implementation Field activities are implemented as per timelines and targets. Demonstrations and farmer training sessions are executed, recorded, and documented with evidence. Certification and Compliance PU/ICS groups maintain required documentation and internal assessment standards. External certification and audit processes are successfully completed with compliance. Capacity Building Planned training is conducted with effective participation of farmers and field teams. Improvement in field team capacity is observed through assessments and qualitative feedback. Monitoring and Documentation Field visit reports, monthly progress updates, and MIS data entries are completed on schedule. Data quality meets required verification standards and supports decision-making. Internal and Stakeholder Coordination Regular internal coordination meetings and review discussions are conducted. Effective engagement and collaboration with partners, community groups, and relevant government departments are maintained. KEY RESPONSIBILITIES Support the development of landscape-level objectives, strategies, and implementation frameworks. Facilitate joint activity planning between wildlife and agriculture programme teams. Plan and facilitate regular review meetings and reporting cycles for programme implementation. Plan and conduct the regular internal coordination meetings and review discussions for effective planning and implementation of various projects in Godavari Landscape programme. Coordinate with the SAP and GLS teams for effective engagement and collaboration with Government, Institutes, partners, community groups, and relevant government departments at district and local level as per the requirement. Align agriculture-based interventions with wildlife-friendly regenerative land-use practices, and conservation efforts of GLS projects. Coordinate with field teams and FPO/FPC partners to ensure timely implementation of activities under SAP projects. Develop seasonal and annual activity plans as per certification requirements (e.g., BCI, ICS). Support PU/ICS documentation, assessments, and record maintenance to ensure certification readiness. Coordinate with Certification Bodies (BCI CBs, Control Union) for queries and audits, if required for specific Pus/ ICS. Conduct regular field visits for supervision, monitoring, troubleshooting, and farmer advisory. Organize capacity building sessions for farmers, field staff, and partners. Requirements Desired Qualifications and Experience: M.Sc. in Biology, Agriculture or related subject from a reputed University in India or abroad. Work experience on sustainable Agriculture or sustainable certification programmes, NRM, conservation in a conservation landscape. More than 5 years of relevant experience is desired.&#34;,&#34;Work_Experience&#34;:&#34;5 -7  years&#34;,&#34;Job_Type&#34;:&#34;Full time&#34;,&#34;Job_Opening_Name&#34;:&#34;Coordinator - Sustainable Agriculture Programme&#34;,&#34;State&#34;:&#34;Telangana&#34;,&#34;Currency&#34;:&#34;INR&#34;,&#34;Country&#34;:&#34;India&#34;,&#34;id&#34;:&#34;708457000020679314&#34;,&#34;Publish&#34;:true,&#34;Date_Opened&#34;:&#34;2026-02-05&#34;,&#34;Keep_on_Career_Site&#34;:false},{&#34;Posting_Title&#34;:&#34;Head/Director \u2013 National Conservation Programme&#34;,&#34;Is_Locked&#34;:false,&#34;City&#34;:&#34;New Delhi&#34;,&#34;Industry&#34;:&#34;Nonprofit Charitable Organizations&#34;,&#34;Job_Description&#34;:&#34;Background WWF India is consolidating its National Conservation Programme to strengthen and deepen its engagement and outreach on key conservation issues of national importance. The Director, NCP will help to strategise and lead theprogramme, building on the current initiatives. Initially, the NCP will bring together WWF India\u2019s work on raptorconservation, small grants and conservation initiatives being run out of our State Office network. Future directions and new initiatives can also be developed based on strategic priorities and funding opportunities. The NCP will complement and work in synergy with other WWF India programmes including wildlife &amp; landscape conservation; freshwater &amp; wetland conservation and coastal &amp; marine conservation. The role&#39;s core responsibilities will initially be focused around managing the Raptor Conservation Programme which brings together science, innovation and stakeholder engagement to design and implement high-priority interventions for vultures, other threatened raptors, and their habitats. The Director, NCP will also be responsible for the management of the Conservation Catalyst Programme which channels targeted small-grant resources and technical mentorship to local partners for conservation of lesser-known, threatened species &amp; habitats. Providing strategic &amp; technical support and coordinating the conservation activities undertaken by WWF India\u2019s branch offices in different states will also be a core responsibility. In addition, as a senior member of the WWF India conservation programme team, the Director, NCP will also be expected to contribute to the larger strategic vision and conservation priorities of the organisation. He/she should be a strategic, dynamic, resourceful and organised conservation professional. This senior leader must have at least ten years of experience managing field conservation and research projects. Experience in raptor or avian ecology would be an added advantage. This role will be based at the WWF-India Secretariat in New Delhi and will report to senior management at WWF-India. Roles &amp; Responsibilities RAPTOR CONSERVATION PROGRAMME (RCP) Provide strategic vision and leadership for the raptor conservation programme to establish WWF-India as aleader in the raptor conservation space. Manage and build the raptor conservation team in the Secretariat and landscapes. Support implementation of innovative and scientific approaches for raptor conservation. Ensure timely data analysis and report publication and coordinate outreach activities. Coordinate with stakeholders as required for the long-term survival of threatened raptors including government and civil society partners Collaborate with the central and state governments to support policies that might have immediate or long-term effects on the conservation of vultures &amp; other raptors and their habitats Lead the preparation of half-yearly technical &amp; financial reports and scientific publications for RCP. Keep track of the finances of the RCP including budgeting and adaptive management. CONSERVATION CATALYST PROGRAMME (CCP) Continue development and evolution of the strategy for CCP to achieve the larger objective of strengthening small, grassroots conservation organizations. Work with the CCP team to coordinate with grantees, develop and implement capacity building approaches. Assess grant proposals for technical quality, feasibility, and alignment with organizational priorities Oversee grant disbursement schedules, compliance with financial and procurement norms, and timely submission of narrative and financial reports by grantees. Provide technical backstopping to grantees, including advice on project design, field methodologies, data management, and communication of results. Coordinate periodic field reviews and audits of grant\u2011supported projects; document lessons learned, success stories, and scalable models for integration into WWF-India\u2019s wider programmes. Compile programme\u2011level synthesis reports on the CCP, highlighting contributions to biodiversity conservation in the country STATE AND BRANCH OFFICES Provide strategic oversight to WWF-India State and Branch offices to ensure alignment with WWF-India\u2019s conservation strategy, annual work plans, and compliance requirements Support state and branch teams in planning, implementing, and monitoring biodiversity conservation projects Establish and periodically review branch\u2011level performance indicators (e.g. project delivery milestones,takeholder and partner engagement, financial utilisation, reporting quality) and support course\u2011correction where needed Facilitate cross\u2011learning between branches and landscape programmes Requirements PhD or equivalent in the field of ornithology/ecology/wildlife/environment/biology. At least 15 years\u2019 experience in the field of conservation or a related area. Ability to design and implement strategies and programmes independently. Experience in managing teams and working collaboratively. Ability to drive high-level discussions with stakeholders, including government departments, scientific institutions and NGOs. Strong written and spoken communication skills in English, with knowledge of any regional language. Last date for application - 2 October 2026 WWF-India is an equal opportunities employer. We encourage applications from women and diverse candidates.&#34;,&#34;Work_Experience&#34;:&#34;15+ years&#34;,&#34;Job_Type&#34;:&#34;Full time&#34;,&#34;Job_Opening_Name&#34;:&#34;Head/Director \u2013 National Conservation Programme&#34;,&#34;State&#34;:&#34;Delhi&#34;,&#34;Currency&#34;:&#34;INR&#34;,&#34;Country&#34;:&#34;India&#34;,&#34;id&#34;:&#34;708457000024377001&#34;,&#34;Publish&#34;:true,&#34;Date_Opened&#34;:&#34;2026-09-02&#34;,&#34;Keep_on_Career_Site&#34;:false},{&#34;Posting_Title&#34;:&#34;Performance Marketing Associate  - Digital Fundraising&#34;,&#34;Is_Locked&#34;:false,&#34;City&#34;:&#34;New Delhi&#34;,&#34;Industry&#34;:&#34;Marketing&#34;,&#34;Job_Description&#34;:&#34;WWF-India, one of the country\u2019s largest conservation organizations working on wildlife and nature conservation, is seeking a Performance Marketing Associate to support its digital fundraising efforts through paid channels. The role will report to the Manager \u2013 Digital Marketing and Fundraising and will support the execution and operational management of paid digital fundraising campaigns across Meta Ads, Google Ads, and other relevant platforms. This is an execution-focused role offering strong learning and growth opportunities in performance marketing and digital fundraising. Job Profile: Digital Fundraising (DFR): Support donor acquisition efforts through paid digital campaigns by optimizing for conversions across donation journeys and aligning campaign execution with key fundraising metrics such as cost per donation and donor acquisition efficiency. Campaign Execution &amp; Monitoring: Execute, monitor, and support optimization of paid media campaigns (SEM, social, display) in alignment with digital fundraising objectives and defined performance goals. Reporting &amp; Performance Tracking: Maintain campaign dashboards and prepare regular reports highlighting key campaign metrics, trends, and observations to support campaign decision-making. A/B Testing Support: Implement and monitor A/B tests across creatives, ad copy, and landing pages to support campaign optimization and improve conversion performance. Budget Tracking: Support campaign budget tracking and spend monitoring across platforms to ensure timely pacing and efficient utilization. Campaign Setup: Implement campaign structures, audience targeting, including retargeting cohorts, and budget allocation in line with defined strategies. Collaboration: Work closely with internal teams and external partners/agencies to coordinate creative assets and support effective campaign execution. Market &amp; Audience Research: Support audience research and stay updated on platform tools, trends, and best practices relevant to digital fundraising campaigns. Conversion &amp; Content Support: Support the execution of email campaigns and user journeys; assist with updates to landing pages and campaign flows; ensure messaging aligns with campaign objectives. Additional Responsibilities: Support other Digital Fundraising (DFR) initiatives and related activities as may be required from time to time. Requirements Qualifications &amp; Experience Required: 1. Graduate/Postgraduate in Marketing, Communications, or related field 2. Minimum 2 years of relevant experience in performance marketing, digital marketing, or paid media 3. Hands-on experience in setting up and managing campaigns on Meta Ads and/or Google Ads, with a focus on driving conversions and optimizing performance metrics (e.g., CPC, CTR, CPA) Desired Skills and Abilities: · Hands-on working knowledge of o paid media platforms (Meta Ads, Google Ads) o online advertising tool (Google Ads, Google Analytics, Meta Ads, Google Tag Manger etc.) o target audience profiling · Understanding of A/B testing, analytical tools and ability to turn metrics into actionable insights · Exceptional writing &amp; editing skills, including writing styles suited for digital media · Willingness to learn and grow in a fast-paced environment · Strong attention to detail and ability to manage multiple tasks · Good communication and coordination skills What the Role Offers · Hands-on experience in managing performance marketing campaigns · Exposure to digital fundraising and donor acquisition strategies · Opportunity to grow into campaign optimization, content, and funnel management&#34;,&#34;Work_Experience&#34;:&#34;1-3 years&#34;,&#34;Job_Type&#34;:&#34;Full time&#34;,&#34;Job_Opening_Name&#34;:&#34;Performance Marketing Associate  - Digital Fundraising&#34;,&#34;State&#34;:&#34;Delhi&#34;,&#34;Currency&#34;:&#34;INR&#34;,&#34;Country&#34;:&#34;India&#34;,&#34;id&#34;:&#34;708457000022749001&#34;,&#34;Publish&#34;:true,&#34;Date_Opened&#34;:&#34;2026-05-21&#34;,&#34;Keep_on_Career_Site&#34;:false},{&#34;Posting_Title&#34;:&#34;Senior Officer/Assistant Manager-E Commerce&#34;,&#34;Is_Locked&#34;:false,&#34;City&#34;:&#34;New Delhi&#34;,&#34;Industry&#34;:&#34;NGO/Social Services&#34;,&#34;Job_Description&#34;:&#34;Job Responsibilities · Drive growth and expansion of WWF-India\u2019s online Conservation Products business. · Manage all existing eCommerce channels for Conservation Products, including the WWF-India online store, Amazon etc. · Manage online backend operations and product catalogue. · Monitor and optimize product portfolio performance across pricing, margins, inventory and sales. · eCommerce &amp; Website Management o Manage and optimize the organization\u2019s eCommerce platform and online store and Amazon o Oversee product listings, pricing, inventory coordination, promotions, and order workflows. o Ensure timely stock updates and order management across channels. o Ensure website content related to products, campaigns, and sales initiatives is accurate, engaging, and updated regularly. o Coordinate with web developers/design teams for website improvements, landing pages, and user experience optimization. o Monitor website performance, traffic, conversions, and sales analytics. · Digital Marketing &amp; Sales Growth o Develop and execute digital marketing (DM) campaigns (with assistance from the DM team) to increase online sales and visibility of conservation products. o Plan and implement promotional campaigns around wildlife awareness days, seasonal c #34;Publish&#34;:true,&#34;Date_Opened&#34;:&#34;2026-06-26&#34;,&#34;Keep_on_Career_Site&#34;:false},{&#34;Posting_Title&#34;:&#34;Director \u2013 Brahmaputra Programme&#34;,&#34;Is_Locked&#34;:false,&#34;City&#34;:&#34;Tezpur&#34;,&#34;Industry&#34;:&#34;Nonprofit Charitable Organizations&#34;,&#34;Job_Description&#34;:&#34;BACKGROUND For three decades, WWF-India has pioneered area-based conservation across the Brahmaputra Basin. To lead its next phase of impact, WWF-India is appointing a Director \u2013 Brahmaputra Programme. This high-profile executive role sits at the critical intersection of terrestrial and freshwater conservation, climate resilience, sustainable agriculture, and community empowerment. Operating as the institutional leader and public face of WWF-India across Assam and Arunachal Pradesh, the Director will orchestrate cross-functional teams, cultivate high-level technical, political and donor partnerships, and drive transformative landscape-level conservation strategies. This includes conservation-related issues (freshwater and terrestrial species and habitats restoration &amp; monitoring, addressing human-wildlife conflict and strengthening protection); social development (community empowerment, sustainable livelihoods); as well as engaging with external drivers such as nature-safeguards in infrastructure, land use change, and agricultural production. Approaches include research &amp; monitoring, capacity building &amp; institutional development, policy &amp; advocacy, and engagement with multiple partners, including local communities, industries, government agencies, and CSOs. As Director, the person is expected to drive the implementation of the programme to deliver its strategic outcomes in close coordination with the internal Programme Steering Group (PSG). The Director \u2013 Brahmaputra Programme will have to manage a team of 30+ staff, comprising ecologists, agriculture specialists, and social scientists, working across various districts of Assam. KEY RESPONSIBILITIES VISIONARY LEADERSHIP &amp; STRATEGIC GROWTH Strategy Execution: Internalise, evolve, and communicate a compelling multi-year vision for the Brahmaputra Programme across WWF-India, the global WWF network, and external partners. Innovation &amp; Adaptation: Partner with the Programme Steering Group (PSG) to continually refine landscape conservation models, integrating cutting-edge approaches to climate adaptation, habitat restoration, and human-wildlife coexistence. Resource Mobilisation: Drive strategic fundraising, capital pipeline development, and donor diversification to ensure long-term financial sustainability for the landscape. OPERATIONAL EXCELLENCE &amp; PROGRAMME GOVERNANCE Portfolio Management: Oversee the end-to-end execution of all committed grants, ensuring technical precision, high-impact deliverables, and financial compliance. Team Leadership &amp; Talent Development: Lead, mentor, and build a high-performing, multidisciplinary team of specialists, scientists, and consultants. Cross-functional Integration: Facilitate coordination between the various cross-cutting teams to align strategies and maximise collaboration for seamless project delivery. Institutional Safeguards: Embed WWF\u2019s Environmental and Social Safeguards Frameworks (ESSF) across all field operations, ensuring ethical, inclusive, and equitable conservation delivery. STAKEHOLDER ENGAGEMENT &amp; POLICY SUPPORT Government &amp; Network Alliances: Cultivate strategic relationships with State Departments, including Forests, Water Resources and Agriculture, District Administrations, CSOs, technical institutions, and industry leaders. Policy Engagement: Design and execute targeted strategies to inform sustainable infrastructure, land-use planning, water resources management and agricultural practices across the basin. Community Co-Design: Strengthen grassroots partnerships with local communities and indigenous institutions to scale sustainable livelihoods and
