# Sources for the Animal Writes sourcing workers (v1).
# Edit freely. Each source needs: id, name, kind, type (news | legal), url.
#   kind: rss         -> any RSS/Atom feed
#         awbi        -> AWBI circulars/advisories table page
# keywords (optional): an item is kept only if its title/summary contains one of these
#   (case-insensitive). Leave out to keep every item.
# v2: court news (Supreme Court, High Courts, NGT) from legal-news publishers, filtered for animals.

defaults:
  lookback_days: 14        # ignore items older than this
  max_items_per_source: 15 # cap per run, protects the API budget

keywords: &animal_keywords
  - animal welfare
  - animal cruelty
  - cruelty to animals
  - stray
  - street dog
  - community dog
  - cattle
  - cow shelter
  - gaushala
  - wildlife
  - veterinary
  - rabies
  - animal birth control
  - "ABC Rules"
  - PCA Act
  - Prevention of Cruelty
  - AWBI
  - Animal Welfare Board
  - पशु
  - जानवर
  - पशुपालन
  - रेबीज

sources:
  - id: gnews-animal-welfare
    name: Google News – animal welfare India
    kind: rss
    type: news
    url: "https://news.google.com/rss/search?q=%22animal+welfare%22+India&hl=en-IN&gl=IN&ceid=IN:en"

  - id: gnews-animal-cruelty
    name: Google News – animal cruelty India
    kind: rss
    type: news
    url: "https://news.google.com/rss/search?q=%22animal+cruelty%22+India&hl=en-IN&gl=IN&ceid=IN:en"

  - id: the-hindu-environment
    name: The Hindu – Energy & Environment
    kind: rss
    type: news
    url: "https://www.thehindu.com/sci-tech/energy-and-environment/feeder/default.rss"
    keywords: *animal_keywords

  - id: awbi-circulars
    name: Animal Welfare Board of India – Circulars
    kind: awbi
    type: legal
    source_type: awbi
    url: "https://awbi.gov.in/circulars"

  - id: awbi-notifications
    name: Animal Welfare Board of India – Notifications
    kind: awbi
    type: legal
    source_type: awbi
    url: "https://awbi.gov.in/notifications"

  # PIB's own RSS (pib.gov.in/RssMain.aspx) answers 403 to automated clients,
  # so PIB releases come through a Google News query limited to pib.gov.in.
  # Court news (v2). source_type "auto-court" tags Supreme Court / High Court / NGT from the headline.
  # Reports about cases are journalism, so they go to News (owner, 14 Oct 2026); PIB releases stay in the Library.
  - id: livelaw-top
    name: LiveLaw
    kind: rss
    type: news
    source_type: auto-court
    url: "https://www.livelaw.in/category/top-stories/google_feeds.xml"
    keywords: *animal_keywords

  - id: barandbench
    name: Bar & Bench
    kind: rss
    type: news
    source_type: auto-court
    url: "https://www.barandbench.com/feed"
    keywords: *animal_keywords

  # Court news: one Google News search per site, past 7 days (12 Oct 2026: the combined site:A OR site:B query with a
  # date window returned the sites' latest headlines whatever the words). No keyword list: the animal-word guard and
  # the relevance check decide ("Livestock markets" has no Sourcing keyword but is an animal case).
  - id: court-news-animals
    name: Court news – LiveLaw
    kind: rss
    type: news
    source_type: auto-court
    url: "https://news.google.com/rss/search?q=site:livelaw.in+(animal+OR+animals+OR+dogs+OR+cattle+OR+cow+OR+wildlife+OR+cruelty+OR+stray+OR+livestock)+when:7d&hl=en-IN&gl=IN&ceid=IN:en"
    lookback_days: 7

  - id: court-news-barandbench
    name: Court news – Bar & Bench
    kind: rss
    type: news
    source_type: auto-court
    url: "https://news.google.com/rss/search?q=site:barandbench.com+(animal+OR+animals+OR+dogs+OR+cattle+OR+cow+OR+wildlife+OR+cruelty+OR+stray+OR+livestock)+when:7d&hl=en-IN&gl=IN&ceid=IN:en"
    lookback_days: 7

  - id: court-news-scobserver
    name: Court news – SC Observer
    kind: rss
    type: news
    source_type: auto-court
    url: "https://news.google.com/rss/search?q=site:scobserver.in+(animal+OR+animals+OR+dogs+OR+cattle+OR+cow+OR+wildlife+OR+cruelty+OR+stray+OR+livestock)+when:7d&hl=en-IN&gl=IN&ceid=IN:en"
    lookback_days: 7

  - id: pib-releases
    name: Press Information Bureau
    kind: rss
    type: legal
    source_type: pib
    url: "https://news.google.com/rss/search?q=site:pib.gov.in+(animal+OR+rabies+OR+veterinary+OR+livestock+OR+wildlife)&hl=en-IN&gl=IN&ceid=IN:en"
    keywords: *animal_keywords

  # --- Campaign 2.0: draft lab animal rules 2026 (16 Oct 2026). Topic tag rule under topic_tags below. ---
  - id: ccsea-whats-new
    name: CCSEA – What's New
    kind: ccsea
    type: legal
    source_type: ccsea
    url: "https://ccsea.gov.in/CCSEAWhatsNews.aspx"
    lookback_days: 30
    # Rows already on the page on 16 Oct 2026 (the draft rules are in the Library already); only new rows come in.
    skip_urls:
      - "https://ccsea.gov.in/WriteReadData/LnPdf/DraftPreventionofCrueltytoAnimals(ControlandSupervisionofExperiment,BreedingandTradingofLaboratoryAnimals)Rules,2026.pdf"
      - "https://ccsea.gov.in/WriteReadData/LnPdf/InspectionsofanimalhousefacilitiesandIAECmeetings.pdf"
      - "https://ccsea.gov.in/WriteReadData/LnPdf/AdministrativeCCSEAAmendmentRules2026.pdf"
      - "https://ccsea.gov.in/WriteReadData/LnPdf/ConveningIAECmeetingthroughphysicalmode.pdf"
      - "https://ccsea.gov.in/WriteReadData/LnPdf/PublicNotice_LetterofPeTAIndia.pdf"
      - "https://ccsea.gov.in/WriteReadData/LnPdf/IAECFunctioning-projectpresentationbyPrincipalInvestigator(PI).pdf"
      - "https://ccsea.gov.in/WriteReadData/LnPdf/VaccinetrialsusingDogs(1).pdf"
      - "https://ccsea.gov.in/WriteReadData/LnPdf/FeeStructureorder.pdf"

  - id: gnews-lab-animal-rules
    name: Google News – lab animal rules India
    kind: rss
    type: news
    url: "https://news.google.com/rss/search?q=(%22CCSEA%22+OR+%22lab+animal+rules%22+OR+%22laboratory+animals+rules%22+OR+%22animal+experiments%22)+India+when:7d&hl=en-IN&gl=IN&ceid=IN:en"
    keywords: &lab_keywords
      - CCSEA
      - CPCSEA
      - laboratory animal
      - lab animal
      - animal experiment
      - animal testing
      - "G.S.R. 864"
      - IAEC
      - Palamur
      - non-animal method

  - id: pfa-substack
    name: People For Animals (Substack)
    kind: rss
    type: news
    url: "https://peopleforanimals.substack.com/feed"
    keywords: *lab_keywords

  - id: peta-india
    name: PETA India
    kind: rss
    type: news
    url: "https://www.petaindia.com/feed/"
    keywords: *lab_keywords

  # --- Library documents (8 Oct 2026): the documents themselves, kept as copies on the site (s.52(1)(q)). ---
  - id: gazette-of-india
    name: Gazette of India
    kind: egazette
    type: legal
    source_type: gazette
    url: "https://egazette.gov.in/"
    lookback_days: 30
    ministries:
      - Ministry of Fisheries, Animal Husbandry and Dairying
      - Ministry of Environment, Forest and Climate Change

  - id: judgments-supreme-court
    name: Supreme Court judgments (open dataset, CC BY 4.0)
    kind: judgments-sc
    type: legal
    url: "https://indian-supreme-court-judgments.s3.ap-south-1.amazonaws.com/"
    lookback_days: 120  # the dataset adds reported judgments some weeks after the decision

  # High Court judgments (kind judgments-hc) are off: case titles there rarely say what a case is about.
  # - id: judgments-high-courts
  #   name: High Court judgments (open dataset, CC BY 4.0)
  #   kind: judgments-hc
  #   type: legal
  #   url: "https://indian-high-court-judgments.s3.ap-south-1.amazonaws.com/"
  #   lookback_days: 60

# Categories: an item gets every category whose keywords appear in its title or summary
# (case-insensitive). Keys are category slugs on the site; unknown slugs are ignored by the site.

  # --- Opportunities (approved 7 Oct 2026). Drafts for review; only metadata + a factual line. ---
  - id: opp-wwf-india
    name: WWF-India careers
    org: WWF-India
    kind: zoho
    type: opportunity
    opportunity_type: job
    lookback_days: 120
    url: "https://wwfindia.zohorecruit.com/jobs/careers"
    match: title  # WWF also hires for fundraising, design and e-commerce; keep conservation roles
    keywords: [conservation, wildlife, biodiversity, species, raptor, tiger, elephant, rhino, bird, aquatic, wetland, river, marine, forest, habitat, veterinar, animal, brahmaputra]

  - id: opp-awbi-notifications
    name: Animal Welfare Board of India – Notifications
    org: Animal Welfare Board of India
    kind: awbi
    type: opportunity
    opportunity_type: event
    lookback_days: 120
    url: "https://awbi.gov.in/Notifications"
    keywords: [invitation for, inviting, award, vacancy, vacancies, recruitment, internship, applications are invited, walk-in]

  # Wildlife SOS careers is fetched by the site itself (animal-writes-core/includes/opportunities-site.php):
  # Cloudflare there refuses GitHub's servers but answers the website's host.

# Topic tags: an item whose title, feed text or summary has one of the phrases gets the tag (when the section allows it).
# "hold": an item that also matches one of these (and has none of the "unless" words) waits in To review whatever the
# other checks say.
topic_tags:
  campaign-lab-animals-2026:
    any: [ccsea, cpcsea, laboratory animal, lab animal, animal experiment, animal testing, "g.s.r. 864", iaec, palamur, non-animal method]
    hold: ['laboratory animals\)? rules,? 2026']
    unless: [draft, objection, comments]
    hold_reason: final lab animal rules may have been notified; check and update the campaign page

categories:
  community-dogs: [stray dog, street dog, community dog, stray dogs, street dogs, community animals, कुत्त]
  animal-birth-control: [animal birth control, abc rules, abc programme, abc program, sterilis, steriliz, neuter]
  rabies-public-health: [rabies, रेबीज, dog bite, anti-rabies, vaccination drive]
  cruelty-prosecution: [cruelty, fir, arrested, prosecution, torture, abuse, poison]
  feeders-caregivers: [feeder, feeding, caregiver]
  cattle-gaushalas: [cattle, cow, gaushala, gaushalas, bovine, बैल, गाय]
  transport-slaughter: [slaughter, transportation of animals, illegal transport, smuggl]
  wildlife: [wildlife, tiger, leopard, elephant, pangolin, forest department, poach, sanctuary, national park]
  birds: [bird, birds, avian, pigeon, kite, peacock]
  pets-breeding: [pet shop, breeder, breeding, dog breed, pet]
  adoption: [adopt, adoption]
  performing-captive-animals: [circus, performing animals, captive, zoo, elephant ride]
  laws-rules: [act, rules, amendment, notification, guidelines, circular, gazette]
  courts-judgments: [supreme court, high court, court, judgment, bench, petition, tribunal]
  policy-government: [ministry, government, minister, municipal, corporation, policy, scheme, cabinet]
  disaster-rescue: [flood, cyclone, earthquake, disaster, rescue operation]
  veterinary-care: [veterinary, vet, hospital, clinic]
  campaigns-civic-action: [campaign, petition, protest, letter, signature, awareness]

# Press discovery (Media & PR): coverage of Animal Writes, found weekly through Google News and Google Search (Gemini) and sent to the site
# as "Press: to review" drafts (never published automatically). No Brave key (no free plan, owner 10 Oct 2026).
press:
  enabled: true
  date_floor: "2025-11-01"
  every_days: 7          # weekly (S4.1)
  monthly_requests: 900  # owner's budget; Brave free plan allows 2,000 a month, 1 a second
  weekly_requests: 200
  backfill_requests: 300 # the first run only
  queries:
    - "Animal Writes"
    - "AnimalWrites"
    - "#animalwrites"
    - "animalwrites.in"
    - "letter petition Supreme Court dogs"
    - "handwritten letters Supreme Court stray dogs"
    - "29 November post office letters Supreme Court"
    - "Ambika Shukla animal"
  sites: [instagram.com, facebook.com, fb.watch, x.com, twitter.com, youtube.com, threads.net, linkedin.com, reddit.com]
